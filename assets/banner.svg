<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: url(#primaryGrad);
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
        font-weight: 600;
        fill: #38bdf8;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 12px;
        font-weight: 600;
        fill: #e2e8f0;
      }
      @keyframes floatGrid {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 60; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.05); }
      }
      @keyframes floatPill {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes dashFlow {
        0% { stroke-dashoffset: 80; }
        100% { stroke-dashoffset: 0; }
      }
      .grid-lines {
        stroke: #1e293b;
        stroke-width: 1;
        opacity: 0.7;
      }
      .pulse-circle {
        animation: pulseGlow 6s ease-in-out infinite;
        transform-origin: center;
      }
      .pill-float-1 {
        animation: floatPill 5s ease-in-out infinite;
      }
      .pill-float-2 {
        animation: floatPill 6s ease-in-out infinite 1s;
      }
      .pill-float-3 {
        animation: floatPill 5.5s ease-in-out infinite 2s;
      }
      .flow-path {
        stroke-dasharray: 6 8;
        animation: dashFlow 20s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="20" fill="url(#bgGrad)" />

  <!-- Ambient Light Orbs (Background Glow) -->
  <circle cx="200" cy="80" r="140" fill="url(#glowGrad)" class="pulse-circle" />
  <circle cx="1020" cy="220" r="160" fill="url(#glowGrad)" class="pulse-circle" />

  <!-- Architectural Background Grid Lines -->
  <g class="grid-lines">
    <line x1="80" y1="0" x2="80" y2="340" />
    <line x1="200" y1="0" x2="200" y2="340" />
    <line x1="320" y1="0" x2="320" y2="340" />
    <line x1="440" y1="0" x2="440" y2="340" />
    <line x1="560" y1="0" x2="560" y2="340" />
    <line x1="680" y1="0" x2="680" y2="340" />
    <line x1="800" y1="0" x2="800" y2="340" />
    <line x1="920" y1="0" x2="920" y2="340" />
    <line x1="1040" y1="0" x2="1040" y2="340" />
    
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="220" x2="1200" y2="220" />
    <line x1="0" y1="300" x2="1200" y2="300" />
  </g>

  <!-- Connecting Animated Data Flow Circuits (Behind Text) -->
  <path d="M 120 280 C 350 280, 420 310, 650 290 S 950 270, 1100 290" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4" class="flow-path" />
  <path d="M 100 70 C 300 40, 500 80, 750 40 S 980 90, 1120 60" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.3" class="flow-path" />

  <!-- Geometric Frame Border -->
  <rect x="2" y="2" width="1196" height="336" rx="18" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.8" />

  <!-- Foreground Title and Core Identity (Never Obscured) -->
  <g transform="translate(80, 50)">
    <!-- Small Category Pill -->
    <rect x="0" y="0" width="195" height="28" rx="14" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="14" cy="14" r="4" fill="#38bdf8" />
    <text x="28" y="19" class="tag-text">MANUFACTURING CRM</text>

    <!-- Main Title -->
    <text x="0" y="74" class="title-text">Awesome Manufacturing CRM</text>

    <!-- Subtitle -->
    <text x="0" y="112" class="subtitle-text">Curated SaaS Platforms, ERP &amp; Open-Source Production Systems</text>
    <text x="0" y="138" class="subtitle-text" font-size="16" fill="#64748b">Production Planning • BOM Management • CPQ • Shop Floor Traceability • MES</text>
  </g>

  <!-- Floating Feature Badges (Positioned cleanly below subtitle) -->
  <g class="pill-float-1" transform="translate(80, 230)">
    <rect width="210" height="42" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" filter="url(#glow)" fill-opacity="0.8" />
    <text x="18" y="26" class="badge-text">⚡ CPQ &amp; Sales Forecasting</text>
  </g>

  <g class="pill-float-2" transform="translate(310, 230)">
    <rect width="215" height="42" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2" filter="url(#glow)" fill-opacity="0.8" />
    <text x="18" y="26" class="badge-text">🏭 BOM &amp; Production MRP</text>
  </g>

  <g class="pill-float-3" transform="translate(545, 230)">
    <rect width="225" height="42" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="1.2" filter="url(#glow)" fill-opacity="0.8" />
    <text x="18" y="26" class="badge-text">📦 Supply Chain &amp; Shop Floor</text>
  </g>

  <g class="pill-float-1" transform="translate(790, 230)">
    <rect width="205" height="42" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.2" filter="url(#glow)" fill-opacity="0.8" />
    <text x="18" y="26" class="badge-text">🌟 Self-Hosted &amp; Open Core</text>
  </g>
</svg>
